apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-client
  template:
    metadata:
      labels:
        app: portfolio-client
    spec:
      containers:
      - name: portfolio-client
        image: chibuzor1/dapp4:latest # Replace with your image name
        ports:
        - containerPort: 5173
